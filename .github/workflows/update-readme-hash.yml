# Optional: keep README commit pin in sync on pushes to main.
name: Update README commit hash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-hash:
    runs-on: ubuntu-latest
    # Avoid infinite loops: skip if the tip commit is already a hash-pin commit
    if: github.event.head_commit.message != 'chore: pin README commit hash'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README hash pin
        run: |
          chmod +x scripts/update_readme_hash.sh
          ./scripts/update_readme_hash.sh

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README hash already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: pin README commit hash"
          git push
